[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orquestra-core-mcp"
version = "0.1.0"
description = "MCP control plane for OrquestraAI: skills, MCP servers, bridge state and master rules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The orquestra-core-mcp authors" }]
keywords = ["mcp", "model-context-protocol", "orquestra", "control-plane", "skills", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["mcp>=2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orquestra-core = "orquestra_core.server:main"

[tool.hatch.build.targets.wheel]
packages = ["orquestra_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
