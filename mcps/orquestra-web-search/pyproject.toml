[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-search-mcp"
version = "0.1.0"
description = "Exa-backed web search MCP server returning cited highlights for agents"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The web-search-mcp authors" }]
keywords = ["mcp", "model-context-protocol", "search", "exa", "web", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3.0",
    "exa-py==2.25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
web-search = "web_search.server:main"

[tool.hatch.build.targets.wheel]
packages = ["web_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration test is the only one that reaches Exa: keep it opt-in with
# `pytest -m integration` so an ordinary run needs neither network nor credits.
addopts = "-q -m 'not integration'"
markers = [
    "integration: calls the real MCP server and Exa; needs network and a key (run with -m integration)",
]
