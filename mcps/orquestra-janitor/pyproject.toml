[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janitor-mcp"
version = "0.1.0"
description = "Linux system health, orphan process sweeper and transient cache cleaner MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The janitor-mcp authors" }]
keywords = ["mcp", "model-context-protocol", "janitor", "linux", "oom", "orphan-processes", "tmpfs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = ["mcp>=2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
janitor = "janitor.server:main"

[tool.hatch.build.targets.wheel]
packages = ["janitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Storage policy: test scratch never touches /tmp (RAM-backed tmpfs here).
addopts = "-q --basetemp=/var/tmp/testing/janitor-pytest"