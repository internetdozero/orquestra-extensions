[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idea-vault-mcp"
version = "0.1.0"
description = "Local SQLite idea vault and inter-agent blackboard MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The idea-vault-mcp authors" }]
keywords = ["mcp", "model-context-protocol", "sqlite", "ideas", "blackboard", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["mcp>=2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
idea-vault = "idea_vault.server:main"

[tool.hatch.build.targets.wheel]
packages = ["idea_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
