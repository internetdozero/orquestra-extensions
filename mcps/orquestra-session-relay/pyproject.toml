[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-relay-mcp"
version = "0.1.0"
description = "Read-only cross-harness session inspection and context handoff MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The session-relay-mcp authors" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "sessions", "handoff", "codex", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["mcp>=2.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
session-relay = "session_relay.server:main"

[tool.hatch.build.targets.wheel]
packages = ["session_relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
